<!--
  MikroTik Hotspot alogin.html - Auto-login page
  
  This page auto-logs in the user and then redirects them to the 
  Thadingyut Spin Wheel with a signed URL.
  
  INSTRUCTIONS:
  1. Replace YOUR_SHARED_SECRET with the same value as HOTSPOT_SECRET in .env
  2. Replace https://your-app.vercel.app with your actual Vercel deployment URL
  3. Upload this file to your MikroTik router's hotspot/alogin.html
  
  MikroTik's template engine provides these variables:
    $(mac)        - Client MAC address
    $(ip)         - Client IP address
    $(username)   - Login username
    $(link-login) - Login URL
-->

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Logging in...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- MD5 library for signature generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
  
  <style>
    body {
      background: #1a0a00;
      color: #FFD700;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #FFD700;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>🏮 ချိတ်ဆက်နေသည်... Connecting...</p>
  </div>
  
  <script>
    // ─── MikroTik template variables ───────────────────────
    // These are replaced by MikroTik's hotspot engine at serve-time
    var mac = '$(mac)';
    var ip  = '$(ip)';
    
    // ─── CONFIGURATION ────────────────────────────────────
    // IMPORTANT: Set this to the SAME value as HOTSPOT_SECRET in your .env
    var SECRET = 'YOUR_SHARED_SECRET';
    
    // IMPORTANT: Set this to your Vercel deployment URL
    var APP_URL = 'https://your-app.vercel.app';
    
    // ─── Generate MD5 signature ───────────────────────────
    var sig = md5(mac + ip + SECRET);
    
    // ─── Build redirect URL ───────────────────────────────
    var redirectUrl = APP_URL + '/spin'
      + '?mac=' + encodeURIComponent(mac)
      + '&ip='  + encodeURIComponent(ip)
      + '&sig=' + encodeURIComponent(sig);
    
    // ─── Redirect after a short delay ─────────────────────
    // Give the hotspot login a moment to complete
    setTimeout(function() {
      window.location.href = redirectUrl;
    }, 2000);
  </script>
</body>
</html>
