<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>ZEUS WiFi - Connected Status</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #00162B 0%, #002244 50%, #001122 100%) !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: #ffffff;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 30, 55, 0.85);
            border: 1px solid rgba(79, 202, 255, 0.3);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(79, 202, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }

        /* 👤 Profile Box: Khaung Min Thant */
        .profile-box {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 1.5px solid rgba(255, 215, 0, 0.4);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .profile-avatar {
            font-size: 42px;
            margin-bottom: 6px;
        }
        .profile-name {
            font-size: 20px;
            font-weight: 800;
            color: #FFD700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .profile-sub {
            font-size: 12px;
            color: #94a3b8;
        }

        /* 📸 Screenshot Instruction Box */
        .instruction-box {
            background: rgba(79, 202, 255, 0.08);
            border: 1px dashed rgba(79, 202, 255, 0.4);
            border-radius: 14px;
            padding: 16px 14px;
            margin-bottom: 20px;
        }
        .instruction-title {
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 6px;
        }
        .instruction-sub {
            color: #93c5fd;
            font-size: 12px;
            line-height: 1.4;
        }

        /* 🔵 Facebook Button */
        .btn-facebook {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #1877F2 0%, #0D65D9 100%);
            color: #ffffff !important;
            font-size: 16px;
            font-weight: 700;
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            box-shadow: 0 4px 18px rgba(24, 119, 242, 0.45);
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-facebook:hover, .btn-facebook:active {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(24, 119, 242, 0.6);
            background: linear-gradient(135deg, #2081ff 0%, #116ee6 100%);
        }

        /* ⏱️ Stay Connected Counter */
        .timer-badge {
            margin-top: 18px;
            font-size: 12px;
            color: #64748b;
        }

        /* 🚪 Logout Button (Discrete) */
        .btn-logout {
            margin-top: 24px;
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Status Indicator (No auto refresh, stays here) -->
        <div class="status-badge">
            <span class="status-dot"></span>
            <span>Wi-Fi ချိတ်ဆက်မှု အောင်မြင်ပါသည်</span>
        </div>

        <!-- 👤 Khaung Min Thant Box -->
        <div class="profile-box">
            <div class="profile-avatar">👨🏻‍💻</div>
            <div class="profile-name">Khaung Min Thant</div>
            <div class="profile-sub">ZEUS WiFi Network Administrator</div>
        </div>

        <!-- 📸 Instruction Box -->
        <div class="instruction-box">
            <div style="font-size: 26px; margin-bottom: 6px;">🎁✨</div>
            <div class="instruction-title">
                ကံစမ်းမဲ SS များကို ဒီ Facebook Acc သို့ ပို့ပေးပါ
            </div>
            <div class="instruction-sub">
                ဆုမဲရယူရန် မဲပေါက်သည့် Screenshot နှင့်တကွ အောက်ပါ Facebook မှတစ်ဆင့် ဆက်သွယ်ပေးပို့နိုင်ပါသည်
            </div>
        </div>

        <!-- 🔵 Facebook Direct Link Button -->
        <a 
            href="https://web.facebook.com/profile.php?id=100027351635993" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="btn-facebook"
        >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            <span>Facebook သို့ ပို့မည်</span>
        </a>

        <!-- Stay Connected Live Timer -->
        <div class="timer-badge">
            အင်တာနက် အသုံးပြုနေသည့် ကြာချိန်: <span id="onlineTimer" style="color: #94a3b8; font-weight: 600;">00:00</span>
        </div>

        <!-- Logout Option -->
        <form action="$(link-logout)" name="logout" method="post">
            <button type="submit" class="btn-logout">
                Wi-Fi ဖြတ်မည် (Disconnect)
            </button>
        </form>
    </div>

    <script>
        // Keep status page alive and show active connection timer
        let seconds = 0;
        const timerEl = document.getElementById('onlineTimer');
        setInterval(function() {
            seconds++;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timerEl.textContent = 
                (mins < 10 ? '0' : '') + mins + ':' + 
                (secs < 10 ? '0' : '') + secs;
        }, 1000);
    </script>
</body>
</html>
