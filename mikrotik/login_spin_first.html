<!--
  =============================================================================
  MikroTik Hotspot login.html - "Spin First, Then Connect Internet" (RECOMMENDED)
  =============================================================================
  
  အကျိုးကျေးဇူး:
  - အင်တာနက် မပွင့်မချင်း ဖုန်း (iOS / Android) က Mini App Window ကို လုံးဝ Auto မပိတ်ပါ!
  - ကံစမ်းဘီးကို အေးအေးဆေးဆေး လှည့်ခွင့်ရမည်၊ ဆုမဲပေါက်ပြီး Screenshot ရိုက်ခွင့်ရမည်။
  - ဆုရရှိပြီးမှသာ "အင်တာနက် စတင်အသုံးပြုမည်" ခလုတ်ကို နှိပ်ပြီး အင်တာနက်ကို ဖွင့်ပေးပါမည်။

  MIKROTIK တွင် ကြိုတင်ပြင်ဆင်ရန် (WALLED GARDEN RULE):
  MikroTik WinBox Terminal တွင် အောက်ပါ command ကို တစ်ကြောင်း ရိုက်ထည့်ပေးပါ:
  /ip hotspot walled-garden add dst-host=*vercel.app
  (အကယ်၍ မိမိကိုယ်ပိုင် domain သုံးပါက dst-host=*yourdomain.com ဟု ထည့်ပါ)
-->

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>သီတင်းကျွတ် ကံစမ်းမဲ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
  <style>
    body {
      background: radial-gradient(ellipse at top, #2d1810 0%, #1a0a00 100%);
      color: #FFD700;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(30, 15, 10, 0.85);
      border: 2px solid #b8860b;
      border-radius: 20px;
      padding: 30px 20px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
    }
    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #FFD700;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #FFD700, #FF6B35);
      color: #000;
      font-weight: bold;
      border-radius: 25px;
      text-decoration: none;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <div style="font-size: 36px; margin-bottom: 10px;">🏮✨🏮</div>
    <h2 style="margin: 0 0 10px; color: #FFD700;">သီတင်းကျွတ် ကံစမ်းမဲ</h2>
    <p style="font-size: 14px; color: #f4d06f; line-height: 1.5;">
      ကံစမ်းဘီးသို့ ခေါ်ဆောင်နေပါသည်...<br>
      Redirecting to Lucky Spin Wheel...
    </p>
    <a id="fallbackLink" class="btn" style="display: none;" href="#">
      တိုက်ရိုက် သွားမည် (Click Here)
    </a>
  </div>

  <script>
    // ─── MikroTik Template Variables ───────────────────────────
    var rawMac = '$(mac)';
    var rawIp  = '$(ip)';
    
    // Normalize MAC and IP
    var mac = (rawMac || '').trim().toUpperCase();
    var ip  = (rawIp  || '').trim();

    // ─── CONFIGURATION ─────────────────────────────────────────
    // Vercel .env ထဲရှိ HOTSPOT_SECRET နှင့် အတိအကျ တူညီရပါမည်
    var SECRET = 'YOUR_SHARED_SECRET';
    var APP_URL = 'https://your-app.vercel.app';

    // ─── Login Submission URL for MikroTik ─────────────────────
    // အသုံးပြုသူ ကံစမ်းပြီးပါက အင်တာနက်ဖွင့်ရန် ခေါ်မည့် URL ဖြစ်ပါသည်
    // Default username guest သို့မဟုတ် trial user login:
    var loginUrl = '$(link-login-only)?dst=' + encodeURIComponent('$(link-orig)') 
                 + '&username=' + encodeURIComponent('$(username)') 
                 + '&password=';

    // ─── Generate MD5 Signature ────────────────────────────────
    var sig = md5(mac + ip + SECRET).toLowerCase();

    // ─── Full Spin URL ─────────────────────────────────────────
    var spinUrl = APP_URL + '/spin'
      + '?mac=' + encodeURIComponent(mac)
      + '&ip='  + encodeURIComponent(ip)
      + '&sig=' + encodeURIComponent(sig)
      + '&login_url=' + encodeURIComponent(loginUrl);

    // Set fallback button href
    var fallback = document.getElementById('fallbackLink');
    if (fallback) {
      fallback.href = spinUrl;
      setTimeout(function() { fallback.style.display = 'inline-block'; }, 2000);
    }

    // Auto redirect
    setTimeout(function() {
      window.location.href = spinUrl;
    }, 800);
  </script>
</body>
</html>
